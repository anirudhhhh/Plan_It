name: Check configured staging
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe deployed staging (read only)
        run: node scripts/staging-smoke.js
        env:
          SMOKE_BASE_URL: ${{ vars.SITE_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SMOKE_USER_ACCESS_TOKEN: ${{ secrets.SMOKE_USER_ACCESS_TOKEN }}
          SMOKE_OPS_ACCESS_TOKEN: ${{ secrets.SMOKE_OPS_ACCESS_TOKEN }}
